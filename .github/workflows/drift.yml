name: upstream-drift

# Re-probe the official Maine Revenue Services / IRS URLs and flag any blank that
# has been re-issued since its mapping was built. Scheduled (not a per-PR gate)
# because it needs network and reflects state on maine.gov / irs.gov, not a PR.

on:
  schedule:
    - cron: "41 7 * * 1" # Mondays 07:41 UTC
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Probe official URLs against the manifest
        run: python3 tools/check_upstream.py --json | tee drift-report.json
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift-report.json
